# ============================================================================
# Nginx 配置 - Docker 环境
# 用于前端静态文件服务 + 后端 API 反向代理
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ====================================================================
    # 日志格式
    # ====================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k flush=10s;

    # ====================================================================
    # 性能优化
    # ====================================================================
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s 5s;
    send_timeout 10s;

    # 缓冲设置
    client_body_buffer_size 128k;
    client_max_body_size 20m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ====================================================================
    # 上游服务器定义
    # ====================================================================
    upstream cwj_backend {
        server backend:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ====================================================================
    # HTTP 服务器（重定向到 HTTPS）
    # ====================================================================
    server {
        listen 80;
        server_name _;
        
        # 健康检查端点
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # 其他请求重定向到 HTTPS（生产环境）
        # 开发环境可以注释掉
        # return 301 https://$host$request_uri;
        
        # 或者在开发环境直接提供服务
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://cwj_backend;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }
    }

    # ====================================================================
    # HTTPS 服务器（生产环境可选）
    # ====================================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name your.domain.com;

    #     # SSL 证书配置
    #     ssl_certificate /etc/nginx/certs/your-cert.crt;
    #     ssl_certificate_key /etc/nginx/certs/your-key.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;

    #     # 安全头
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-XSS-Protection "1; mode=block" always;

    #     # 前端静态文件
    #     location / {
    #         root /usr/share/nginx/html;
    #         index index.html;
    #         try_files $uri $uri/ /index.html;
    #     }

    #     # 后端 API 代理
    #     location /api/ {
    #         proxy_pass http://cwj_backend;
    #         include /etc/nginx/conf.d/proxy_headers.conf;
    #     }

    #     # 静态资源缓存优化
    #     location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    #         expires 30d;
    #         add_header Cache-Control "public, immutable";
    #     }
    # }

    # 包含额外配置
    include /etc/nginx/conf.d/*.conf;
}
