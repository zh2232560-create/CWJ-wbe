  #     POSTGRES_DB: cwj_db
  #     POSTGRES_USER: cwj_user
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
  #   volumes:
  #     - cwj_postgres_data:/var/lib/postgresql/data
  #     - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #   networks:
  #     - cwj-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U cwj_user"]
  #     interval: 10s
  #     timeout: 5s
