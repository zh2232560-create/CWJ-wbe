# ============================================================================
# 数据卷定义
# ============================================================================
volumes:
  cwj_db_data:
    driver: local
  cwj_logs:
    driver: local
  cwj_ssl_certs:
    driver: local
  cwj_nginx_logs:
    driver: local
  # cwj_redis_data:
  #   driver: local
  # cwj_postgres_data:
  #   driver: local
  # cwj_prometheus_data:
  #   driver: local

# ============================================================================
# 网络定义
# ============================================================================
networks:
  cwj-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
