version: '3.8'

# ============================================================================
# 蔡文姬智能管理系统 - Docker Compose 配置
# 包含：前端、后端、数据库、日志、缓存等完整配置
# ============================================================================

services:

  # ========================================================================
  # 后端 API 服务
  # ========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cwj-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Node.js 配置
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=512"
      
      # 应用配置
      PORT: 3000
      LOG_LEVEL: info
      
      # AI 模型配置（必须设置）
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-your_api_key_here}
      DOUBAO_MODEL_ID: doubao-seed-1-6-251015
      DOUBAO_API_URL: https://ark.cn-beijing.volces.com/api/v3
      
      # 数据库配置
      DB_PATH: /app/db/chat.db
      
      # 日志配置
      LOG_DIR: /app/logs
    
    # 数据卷
    volumes:
      # 数据库持久化
      - cwj_db_data:/app/db
      # 日志持久化
      - cwj_logs:/app/logs
      # 数据文件（用于 AI 上下文）
      - ./data:/app/data:ro
    
    # 网络
    networks:
      - cwj-network
    
    # 依赖关系
    depends_on:
      - nginx
    
    # 日志驱动
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

  # ========================================================================
  # Nginx 反向代理（前端 + API 代理）
  # ========================================================================
  nginx:
    image: nginx:alpine
    container_name: cwj-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 配置
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      
      # 前端静态文件
      - ./dist:/usr/share/nginx/html:ro
      
      # SSL 证书（需手动配置或 Let's Encrypt）
      - cwj_ssl_certs:/etc/nginx/certs:ro
      
      # 日志
      - cwj_nginx_logs:/var/log/nginx
    
    networks:
      - cwj-network
    
    depends_on:
      - backend
    
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ========================================================================
  # 可选：Redis 缓存（用于会话缓存）
  # ========================================================================
  # redis:
